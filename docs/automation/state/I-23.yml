decisions:
  rename: >-
    DynamicSystemPlan -> Application.Drawing.HeaderRunPlan. NO se aplica el "SystemPlan" del ROADMAP:
    es ambiguo en este arbol y colisiona con SystemBomBuilder/SystemDescriptor/SystemRegistry/
    SystemBlockWriter, que si son por sistema.
  larguero_bucket: >-
    Larguero recibe namespace propio (2 archivos) aunque no estaba en la lista de cinco del encargo:
    es un RackSystemKind real y dejarlo suelto mantendria viva la raiz plana que E8 denuncia.
  plugin_headers_dissolved: >-
    CORREGIDO en la segunda ronda. La primera ronda lo preservo por analogia con RackFrames y la
    analogia era falsa: ese subarbol DIBUJA, no modela, y BlockPlacement/BlockLibraryImporter/
    RackBlockRenamer no son de cabecera. Disuelto en Plugin.Drawing, simetrico con Application.Drawing.
  ui_repartida: >-
    CORREGIDO en la segunda ronda. RackCad.UI tenia el mismo namespace plano multi-sistema. Las cinco
    ventanas de sistema van a UI.Systems.<Sistema>, el configurador y sus modelos a UI.RackFrames.
    Controls/Editor/Preview/Shell/Themes y los dialogos compartidos de seguridad NO se reparten: un
    dialogo compartido no se asigna a un sistema por numero de consumidores.
  editorconfig_not_enforced_in_build: >-
    EnforceCodeStyleInBuild NO se activa: el proyecto WPF compila via RackCad.UI_<hash>_wpftmp e
    IDE0130 deriva de ESE nombre el namespace esperado, produciendo 68 advertencias falsas. La
    autoridad real es NamespaceFolderGuardTests, que corre en CI.

