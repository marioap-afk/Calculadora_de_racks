# CI mínimo de RackCad (auditoría 2026-07-16).
# El Plugin queda fuera: sus referencias (AcCoreMgd/AcDbMgd/AcMgd) requieren AutoCAD instalado.
# La suite corre en ubuntu (Domain/Application son net8.0 puro); la UI compila en windows (WPF),
# lo que valida transitivamente Domain y Application contra cambios de API.
name: CI

# Corre en TODO push (sin lista de ramas: una copia de los prefijos de WORKFLOW §1 aquí divergiría,
# y el checklist de cierre exige "CI verde en la rama" para cualquier iniciativa). Sin trigger
# pull_request para no duplicar corridas; la compuerta de integración es el CI del push (WORKFLOW §4.5).
#
# workflow_dispatch (I-45 G6-C1) es el ÚNICO camino para pedir cobertura de un Candidato. Es explícito
# a propósito: el Candidato lo declara el proceso, nunca se infiere del nombre de la rama, de las rutas
# tocadas, del mensaje del commit ni de "el último SHA". El SHA viaja como INPUT y no como ref del
# dispatch, porque la API documenta el ref del dispatch como rama o tag, no como commit suelto.
on:
  push:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "SHA COMPLETO (40 hex minúsculas) del Candidato sobre el que medir cobertura"
        required: true
        type: string

# I-45 G6-C1, y no es decoración. `Directory.Build.targets` resuelve el SHA que se estampa en
# `InformationalVersion` con esta prioridad: $(SourceRevisionId), luego $(GITHUB_SHA), y solo si no hay
# ninguno invoca `git rev-parse HEAD`. En un dispatch de Candidato el checkout es el SHA pedido pero
# GITHUB_SHA sigue siendo la PUNTA del ref despachado, así que sin esta línea TODOS los ensamblados de
# esa corrida saldrían marcados con un commit que no es el que compilaron — en silencio, y rompiendo
# justo la trazabilidad binario↔commit sobre la que G6 apoya su regla de SHA exacto.
# En un push el input llega vacío, la propiedad queda vacía y el comportamiento es el de siempre.
env:
  SourceRevisionId: ${{ inputs.candidate_sha }}

jobs:
  tests:
    name: Tests (Domain + Application)
    runs-on: ubuntu-latest
    # Fusible contra cuelgues (I-45 G2), no un SLA. El maximo observado de este job es ~2.5 min, asi
    # que 20 deja ~8x de holgura: absorbe la variacion del runner sin volver roja una corrida lenta
    # legitima, y corta un hang real. Es la red EXTERIOR: --blame-hang (5 min) dispara antes y deja
    # diagnostico; este timeout solo actua si el propio blame se queda encallado.
    timeout-minutes: 20
    steps:
      # I-45 G6-C1. Decide UNA vez la cadencia de cobertura de ADR-0033 §9 y la deja escrita en el log,
      # que es lo que la vuelve auditable. Se calcula en shell y no en una expresion porque el SHA
      # objetivo tambien se valida aqui: comparar SHAs dentro de una expresion de Actions es inseguro
      # (las cadenas se coercionan a numero en silencio).
      #
      # El input NUNCA se interpola en el cuerpo del script: entra por `env`, que es lo que la guia de
      # seguridad de GitHub prescribe para entradas no confiables.
      - name: Cadencia de cobertura y SHA objetivo
        id: cadence
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # En un dispatch manda el input y NO hay fallback: caer a la punta de la rama mediria un
          # commit que nadie pidio y publicaria su cobertura como si fuera la del Candidato. En un
          # push el contexto `inputs` no esta poblado y el objetivo es el commit empujado.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "${CANDIDATE_SHA:-}" ]; then
              echo "::error::un dispatch de cobertura exige candidate_sha explicito; no se asume la punta de la rama."
              exit 1
            fi
            TARGET="$CANDIDATE_SHA"
          else
            TARGET="$FALLBACK_SHA"
          fi

          # Fail-closed de FORMA, antes de gastar un checkout: actions/checkout solo reconoce como
          # commit un SHA de 40 hex. Uno corto no falla como "SHA invalido": lo busca como rama y
          # muere con un mensaje que despista.
          #
          # Se compara la CADENA COMPLETA con [[ =~ ]], no con grep: grep ancla por LINEA, de modo que
          # un input con un salto de linea embebido pasaria el guardia y sus lineas extra acabarian
          # escritas como asignaciones en GITHUB_OUTPUT unas lineas mas abajo.
          if [[ ! "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SHA objetivo invalido; se exige un SHA completo de 40 hex minusculas."
            exit 1
          fi

          # Cobertura SOLO en Candidato (dispatch explicito) y en el trunk. En el push ordinario, no.
          # Se acepta tanto `main` literal como la rama por defecto que declare el repositorio: si el
          # trunk se renombrara, comparar solo contra la constante apagaria la cobertura del trunk en
          # SILENCIO, sin rojo y sin aviso, que es el unico modo de perderla sin que nadie lo note.
          TRUNK="${DEFAULT_BRANCH:-main}"
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$EVENT" = "push" ] && { [ "$REF" = "refs/heads/main" ] || [ "$REF" = "refs/heads/$TRUNK" ]; }; }; then
            COLLECT=true
          else
            COLLECT=false
          fi

          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "collect=$COLLECT" >> "$GITHUB_OUTPUT"
          echo "evento=$EVENT ref=$REF objetivo=$TARGET cobertura=$COLLECT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.cadence.outputs.sha }}

      # Fail-closed de IDENTIDAD. Sin esto no hay garantia de que la cobertura se midiera sobre el SHA
      # pedido, solo esperanza: si el commit no existiera o checkout resolviera otra cosa, el job debe
      # morir en rojo en vez de publicar cobertura del commit equivocado.
      - name: Verificar que el checkout es el SHA pedido
        env:
          WANT: ${{ steps.cadence.outputs.sha }}
        run: |
          set -euo pipefail
          GOT="$(git rev-parse HEAD)"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::checkout en $GOT pero se pidio $WANT"
            exit 1
          fi
          echo "SHA verificado: $GOT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # I-45 G2: se anaden el logger TRX y --blame-hang. La poblacion de pruebas NO cambia (sin
      # --filter) y el --results-directory es el mismo.
      #
      # I-45 G6-C1: los dos fragmentos de cobertura son condicionales, y son los UNICOS condicionales:
      # la suite sigue siendo completa en todos los caminos. Se mantiene UN solo comando en vez de dos
      # pasos alternativos para que las banderas de diagnostico no puedan divergir entre ellos. El
      # idioma `cond && 'x' || ''` es seguro aqui porque el operando verdadero nunca es vacio.
      - name: dotnet test Core (TRX + blame-hang; Cobertura solo en Candidato y trunk)
        run: >
          dotnet test tests/RackCad.Tests/RackCad.Tests.csproj -c Debug -v:minimal
          ${{ steps.cadence.outputs.collect == 'true' && '--collect:"XPlat Code Coverage"' || '' }}
          --logger "trx;LogFileName=core.trx"
          --results-directory artifacts/TestResults
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          ${{ steps.cadence.outputs.collect == 'true' && '-- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura' || '' }}
      - name: Normalize coverage path
        if: steps.cadence.outputs.collect == 'true'
        shell: pwsh
        run: |
          $allCoverage = @(Get-ChildItem -LiteralPath artifacts/TestResults -Recurse -File -Filter coverage.cobertura.xml)

          # I-45 G2: --blame copia los adjuntos de la corrida a "_<maquina>_<timestamp>/In/<maquina>/",
          # asi que el mismo coverage.cobertura.xml aparece DOS veces. Se verifico en la corrida
          # d8d9919 que ambos son byte-identicos (mismo tamano y mismo SHA-1): es una copia, no una
          # segunda medicion. Se descarta por RUTA para conservar el invariante "exactamente uno" en
          # vez de debilitarlo a "toma el primero": si algun dia aparecen dos coberturas de verdad,
          # este paso debe seguir fallando.
          $coverageFiles = @($allCoverage | Where-Object { $_.FullName -notmatch '[\\/]_[^\\/]+[\\/]In[\\/]' })

          if ($coverageFiles.Count -ne 1) {
            throw "Expected exactly one coverage.cobertura.xml outside the blame attachment folder, found $($coverageFiles.Count) (of $($allCoverage.Count) total)."
          }

          $destination = "artifacts/coverage/coverage.cobertura.xml"
          New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
          Copy-Item -LiteralPath $coverageFiles[0].FullName -Destination $destination

          # I-45 G6-C1: el artifact viaja con el SHA que REALMENTE se midio. En un dispatch, el
          # head_sha del registro de la corrida es la punta del ref despachado y NO el commit medido,
          # asi que sin esto el artifact seria indistinguible de uno tomado sobre otro commit.
          @(
            "measured_sha=$(git rev-parse HEAD)"
            "event=$env:GITHUB_EVENT_NAME"
            "run_head_sha=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
          ) | Set-Content -LiteralPath "artifacts/coverage/measured-sha.txt" -Encoding utf8
      # La ausencia deliberada de cobertura en un push ordinario NO es un aviso ni un error: el paso
      # simplemente no corre. `if-no-files-found: error` se conserva para los caminos que SI la
      # recolectan, donde un artifact vacio si seria un fallo real.
      - name: Upload Cobertura coverage
        if: steps.cadence.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rackcad-coverage-cobertura
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 14
      # if: always() para no perder el diagnostico justo cuando la prueba falla, que es cuando sirve.
      # if-no-files-found: warn (no error) a proposito: si el paso de pruebas muere antes de crear
      # ningun archivo, un artifact vacio NO debe anadir un segundo fallo que tape el original.
      - name: Upload Core test diagnostics (TRX + blame)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rackcad-core-test-diagnostics
          path: artifacts/TestResults
          if-no-files-found: warn
          retention-days: 14

  build-ui:
    name: Build UI (WPF, valida API de Application)
    runs-on: windows-latest
    # Fusible (I-45 G2). Maximo observado ~1.5 min; 15 deja ~10x de holgura.
    timeout-minutes: 15
    steps:
      # Mismo SHA objetivo que el job `tests`: en un dispatch de Candidato TODOS los jobs corren sobre
      # el commit pedido, no sobre la punta de la rama. En un push el input llega vacio —el contexto
      # `inputs` no esta poblado— y la expresion cae a `github.sha`, que es el commit empujado. La
      # validacion de forma y la comprobacion fail-closed del SHA viven en `tests`, que es donde se
      # mide la cobertura.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: dotnet build UI
        run: dotnet build src/RackCad.UI/RackCad.UI.csproj -c Debug -v:minimal

  ui-tests:
    name: UI Tests (WPF controls, net8.0-windows)
    # The reusable controls (I-14) are born with tests; WPF needs a Windows runner and STA, so this is
    # a dedicated job (the Domain/Application suite stays on ubuntu). It does not gate the Plugin build.
    runs-on: windows-latest
    # Fusible (I-45 G2). Es el job mas largo: maximo observado ~4.5 min, asi que 25 deja ~5.5x de
    # holgura sobre el peor caso medido. Importa especialmente aqui: la suite de UI marshala la mayor
    # parte de sus pruebas sobre UN hilo STA compartido cuyo dialogo por defecto es un MessageBox
    # modal REAL, de modo que un cuelgue seria indefinido y hasta hoy este job no tenia ninguna red.
    timeout-minutes: 25
    steps:
      # Mismo SHA objetivo que el job `tests`: en un dispatch de Candidato TODOS los jobs corren sobre
      # el commit pedido, no sobre la punta de la rama. En un push el input llega vacio —el contexto
      # `inputs` no esta poblado— y la expresion cae a `github.sha`, que es el commit empujado. La
      # validacion de forma y la comprobacion fail-closed del SHA viven en `tests`, que es donde se
      # mide la cobertura.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # I-45 G2: TRX propio, directorio de resultados propio y blame-hang. La poblacion de pruebas NO
      # cambia (sin --filter) y la configuracion sigue siendo Debug. --blame-hang NO resuelve la
      # carrera de estado global que Discovery documento: solo hace DIAGNOSTICABLE su manifestacion,
      # nombrando la prueba que dejo de progresar en vez de morir muda.
      - name: dotnet test UI controls (TRX + blame-hang)
        run: >
          dotnet test tests/RackCad.UI.Tests/RackCad.UI.Tests.csproj -c Debug -v:minimal
          --logger "trx;LogFileName=ui.trx"
          --results-directory artifacts/UiTestResults
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
      - name: Upload UI test diagnostics (TRX + blame)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rackcad-ui-test-diagnostics
          path: artifacts/UiTestResults
          if-no-files-found: warn
          retention-days: 14

  build-plugin:
    name: Build Plugin without AutoCAD
    needs:
      - tests
      - build-ui
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Mismo SHA objetivo que el job `tests`: en un dispatch de Candidato TODOS los jobs corren sobre
      # el commit pedido, no sobre la punta de la rama. En un push el input llega vacio —el contexto
      # `inputs` no esta poblado— y la expresion cae a `github.sha`, que es el commit empujado. La
      # validacion de forma y la comprobacion fail-closed del SHA viven en `tests`, que es donde se
      # mide la cobertura.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare isolated build paths
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "rackcad-i13"
          $packages = Join-Path $root "nuget-packages"
          $emptyAutoCAD = Join-Path $root "empty-autocad"
          $httpCache = Join-Path $root "nuget-http-cache"
          $scratch = Join-Path $root "nuget-scratch"
          $cliHome = Join-Path $root "dotnet-home"
          $nugetConfig = Join-Path $root "NuGet.Config"
          $lockFile = Join-Path $root "packages.lock.json"

          New-Item -ItemType Directory -Force -Path $packages, $emptyAutoCAD, $httpCache, $scratch, $cliHome | Out-Null
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          "@ | Set-Content -LiteralPath $nugetConfig -Encoding utf8

          "I13_NUGET_PACKAGES=$packages" >> $env:GITHUB_ENV
          "I13_EMPTY_AUTOCAD_DIR=$emptyAutoCAD" >> $env:GITHUB_ENV
          "I13_NUGET_CONFIG=$nugetConfig" >> $env:GITHUB_ENV
          "I13_LOCK_FILE=$lockFile" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$packages" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=$httpCache" >> $env:GITHUB_ENV
          "NUGET_SCRATCH=$scratch" >> $env:GITHUB_ENV
          "DOTNET_CLI_HOME=$cliHome" >> $env:GITHUB_ENV
          "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $env:GITHUB_ENV
          "DOTNET_NOLOGO=1" >> $env:GITHUB_ENV
          "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1" >> $env:GITHUB_ENV
      - name: Verify AutoCAD compile references
        shell: pwsh
        run: |
          ./eng/ci/verify-autocad-references.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -NuGetPackages $env:I13_NUGET_PACKAGES `
            -EmptyAutoCADDir $env:I13_EMPTY_AUTOCAD_DIR `
            -NuGetConfig $env:I13_NUGET_CONFIG `
            -LockFile $env:I13_LOCK_FILE
